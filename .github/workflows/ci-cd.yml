name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: monitor_test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:mysecretpassword@localhost:5433/monitor_test_db
          JWT_SECRET_KEY: test_secret_key_for_ci
          JWT_REFRESH_SECRET_KEY: test_refresh_key_for_ci
        run: |
          uv run alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:mysecretpassword@localhost:5433/monitor_test_db
          JWT_SECRET_KEY: test_secret_key_for_ci
          JWT_REFRESH_SECRET_KEY: test_refresh_key_for_ci
        run: |
          uv run pytest

