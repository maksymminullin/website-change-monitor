{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh]">
    <div class="w-full max-w-2xl text-center">

        <h1 class="text-4xl font-bold mb-2">Add New Page</h1>
        <p class="text-base-content/70 mb-8">Enter the URL of the webpage you want to monitor for changes.</p>

        <form hx-post="/api/v1/tracked-pages"
              hx-target="#result-message"
              hx-swap="innerHTML"
              hx-on::after-request="if(event.detail.successful) this.reset()"
              class="flex gap-4">

            <input type="url" name="url" placeholder="https://example.com"
                   class="input input-bordered input-lg w-full shadow-sm" required />

            <button type="submit" class="btn btn-primary btn-lg">
                <i data-lucide="plus" class="w-5 h-5"></i>
                Track
            </button>
        </form>

        <div id="result-message" class="mt-4"></div>

    </div>
</div>
{% endblock %}
